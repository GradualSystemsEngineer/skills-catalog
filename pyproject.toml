[project]
name = "skills-catalog"
version = "0.1.0"
description = "Publish, discover, retrieve and version AI-assistant skills through a shared catalog."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "fastapi",
    "uvicorn",
    "httpx",
    "pyyaml",
]

[project.scripts]
catalog = "skills_catalog.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
